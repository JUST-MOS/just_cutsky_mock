[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mockgen"
version = "0.2.0"
description = "Cutsky HOD mock generator"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "h5py>=3.8",
  "joblib>=1.3",
  "tqdm>=4.65",
]

[project.scripts]
make-mock = "just_cutsky_mock.cli:main"

[tool.setuptools.packages.find]
where = ["py"]

[tool.setuptools.package-data]
mockgen = ["*.npz"]
