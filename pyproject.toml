[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "just_cutsky_mock"
version = "1.0"
description = "Generating JUST Cutsky Lightcone Mock"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "h5py>=3.8",
  "joblib>=1.3",
  "tqdm>=4.65",
]

[project.scripts]
just_cutsky_mock = "just_cutsky_mock.cli:main"

[tool.setuptools.packages.find]
where = ["py"]

[tool.setuptools.package-data]
just_cutsky_mock = ["data/*.npz"]
